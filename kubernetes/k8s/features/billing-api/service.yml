apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-api
    app.kubernetes.io/part-of: techchallenge-oficina
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: billing-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      # Igual a api_node_ports.billing em kubernetes/infra/foundation/locals.tf do repo MANAGEMENT (NLB e rota /billing)
      nodePort: 30082
