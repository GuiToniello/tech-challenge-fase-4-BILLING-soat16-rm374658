apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: billing

resources:
  - base/namespace.yml
  - features/billing-api/configmap.yml
  - features/billing-api/deployment.yml
  - features/billing-api/hpa.yml
  - features/billing-api/service.yml

secretGenerator:
  - name: billing-api-secrets
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true
