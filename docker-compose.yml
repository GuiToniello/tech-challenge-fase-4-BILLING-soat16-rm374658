services:
  postgres:
    image: postgres:17-alpine
    container_name: oficina-billing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina_billing}
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sa} -d ${POSTGRES_DB:-oficina_billing}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SQS local (filas FIFO definidas em elasticmq.conf): o Billing consome a sua fila e publica nas do OS Service e da Management
  elasticmq:
    image: docker.io/softwaremill/elasticmq-native:1.6.14
    container_name: oficina-billing-elasticmq
    ports:
      - "${ELASTICMQ_PORT:-9326}:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    restart: unless-stopped

  # DynamoDB local (historico de pagamentos): em memoria, a tabela e criada pela API ao subir
  dynamodb-local:
    image: docker.io/amazon/dynamodb-local:3.1.0
    container_name: oficina-billing-dynamodb
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    restart: unless-stopped

  billing-api:
    image: ${REGISTRY_PREFIX:-}techchallenge-oficina-billing:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: 1 - Frameworks & Drivers/TechChallenge.Oficina.Billing.API/Dockerfile
    container_name: oficina-billing-api
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
      dynamodb-local:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Serilog__MinimumLevel__Default: ${LOG_LEVEL_DEFAULT:-Information}
      Serilog__MinimumLevel__Override__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}
      DatabaseSettings__ConnectionString: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=oficina_billing;Username=sa;Password=P@ssw0rd123}
      SqsSettings__FilaConsumo: techchallenge-oficina-billing.fifo
      SqsSettings__FilasPublicacao__0: techchallenge-oficina-os-service.fifo
      SqsSettings__FilasPublicacao__1: techchallenge-oficina-management.fifo
      SqsSettings__ServiceUrl: ${SQS_SERVICE_URL:-http://elasticmq:9324}
      DynamoDbSettings__ServiceUrl: ${DYNAMODB_SERVICE_URL:-http://dynamodb-local:8000}
      # Credenciais ficticias para o ElasticMQ e o DynamoDB local (nao validam assinatura); fixas para nunca herdar credenciais AWS reais do shell
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      # Sem access token o Billing usa o gateway de pagamento simulado; sem chave do Resend o envio do orcamento responde 400
      MercadoPagoSettings__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MercadoPagoSettings__NotificationUrl: ${MERCADOPAGO_NOTIFICATION_URL:-}
      ResendSettings__ApiKey: ${RESEND_API_KEY:-}
    ports:
      - "${API_BILLING_PORT:-7196}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
